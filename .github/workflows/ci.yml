name: Elixir CI

# Runs when changes are pushed to `main`, or pushed to a pull request
# branch that targets `main`.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}${{ matrix.lint && ' (lint)' || '' }}"
    strategy:
      # Run every matrix entry to completion. A failure (or flake) in one
      # toolchain must not cancel the others, otherwise it masks their result.
      fail-fast: false
      # Each Elixir minor on every OTP major it supports, each at its latest
      # patch release. The last entry is the canonical (lint) one.
      matrix:
        include:
          - elixir: "1.17.3-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.17.3-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.18.6-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.18.6-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.19.7-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.19.7-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.19.7-otp-28"
            otp: "28.5.0.8"
          - elixir: "1.20.5-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.20.5-otp-28"
            otp: "28.5.0.8"
          - elixir: "1.20.5-otp-29"
            otp: "29.1.2"
            lint: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # deps and _build hold compiled BEAMs, which are tied to the OTP and
      # Elixir versions, so the key and its fallback are both scoped to them.
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Run credo
        if: matrix.lint
        run: mix credo --strict

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        if: ${{ !matrix.lint }}
        run: mix test

      # On the lint entry the suite runs under coverage instead, enforcing
      # the minimum threshold configured in coveralls.json.
      - name: Run tests with coverage
        if: matrix.lint
        run: mix coveralls

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v6
        with:
          path: _build/dev/dialyxir_*
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      # dialyxir is a dev dependency, so dialyzer runs under MIX_ENV=dev.
      - name: Run dialyzer
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix dialyzer

      - name: Check docs
        if: matrix.lint
        env:
          MIX_ENV: release
        run: mix docs --warnings-as-errors
